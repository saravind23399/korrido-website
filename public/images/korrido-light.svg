<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 280 80" width="280" height="80" role="img" aria-labelledby="kl-title kl-desc">
  <title id="kl-title">Korrido</title>
  <desc id="kl-desc">Korrido wordmark with amber motion accent for dark backgrounds.</desc>
  <defs>
    <style>
      .wm { font-family: 'Space Mono', 'Montserrat', 'Helvetica Neue', Arial, sans-serif; font-weight: 700; font-size: 42px; letter-spacing: -1.5px; }
    </style>
  </defs>
  <g id="wordmark">
    <text x="8" y="48" class="wm" fill="#FCF8F3">Korrido</text>
  </g>
  <g id="accent">
    <path d="M10 58 L170 58 L160 64 L8 64 Z" fill="#E8A33D"/>
    <circle cx="170" cy="58" r="3.5" fill="#E8A33D"/>
  </g>
</svg>
